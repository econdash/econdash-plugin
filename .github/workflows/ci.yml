name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # catches tool descriptions changed on the server between releases

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Claude plugin validation
        run: |
          # 2.1.305 is the first release with `plugin validate --profile directory`
          npm install --global --no-fund --no-audit @anthropic-ai/claude-code@2.1.305
          claude plugin validate .claude-plugin/plugin.json --strict
          claude plugin validate .claude-plugin/marketplace.json --strict
          claude plugin validate . --strict --profile directory

      - name: Manifests agree and point at the EconDash server only
        run: |
          set -euo pipefail
          jq -e '. == {"mcpServers": {"econdash": {"type": "http", "url": "https://mcp.econdash.org/mcp"}}}' .mcp.json \
            || { echo "::error file=.mcp.json::must declare exactly one server: econdash, type http, url https://mcp.econdash.org/mcp"; exit 1; }
          jq -e '
            (keys - ["name", "version", "description", "mcpServers", "contextFileName"]) == []
            and .name == "econdash"
            and (.version | test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))
            and (.description | type == "string" and length > 0)
            and .mcpServers == {"econdash": {"httpUrl": "https://mcp.econdash.org/mcp"}}
            and .contextFileName == "GEMINI.md"
          ' gemini-extension.json \
            || { echo "::error file=gemini-extension.json::unexpected keys or values"; exit 1; }
          jq -e '.name == "econdash" and .plugins == [.plugins[0]] and .plugins[0].name == "econdash" and .plugins[0].source == "./"' .claude-plugin/marketplace.json \
            || { echo "::error file=.claude-plugin/marketplace.json::must list exactly one plugin, econdash, at ./"; exit 1; }
          # Grok Build rejects a plugin at the marketplace root ("./"), so its copy points at the repository URL
          jq -e --slurpfile c .claude-plugin/marketplace.json '
            . == ($c[0] | {name, description, owner, plugins}
                  | .plugins[0].source = {"source": "url", "url": "https://github.com/econdash/econdash-plugin.git"})
          ' .grok-plugin/marketplace.json \
            || { echo "::error file=.grok-plugin/marketplace.json::must equal .claude-plugin/marketplace.json with the source set to the repository URL"; exit 1; }
          claude_version=$(jq -r .version .claude-plugin/plugin.json)
          gemini_version=$(jq -r .version gemini-extension.json)
          [ "$claude_version" = "$gemini_version" ] \
            || { echo "::error::plugin.json version $claude_version differs from gemini-extension.json version $gemini_version"; exit 1; }
          # Antigravity reads .antigravity-plugin/plugin.json before the root plugin.json (the OpenAI package)
          # and takes its servers from mcp_config.json
          jq -e '. == {"mcpServers": {"econdash": {"serverUrl": "https://mcp.econdash.org/mcp"}}}' mcp_config.json \
            || { echo "::error file=mcp_config.json::must declare exactly one server: econdash, serverUrl https://mcp.econdash.org/mcp"; exit 1; }
          jq -e --arg v "$claude_version" --slurpfile c .claude-plugin/plugin.json '
            ."$schema" == "https://antigravity.google/schemas/v1/plugin.json"
            and .name == "econdash" and .displayName == "EconDash" and .version == $v
            and .author == $c[0].author and .keywords == $c[0].keywords
            and (.suggestedPrompts | length) <= 3
            and (.logo | test("^assets/.+\\.png$"))
          ' .antigravity-plugin/plugin.json \
            || { echo "::error file=.antigravity-plugin/plugin.json::schema, name, version, author, keywords or logo differ from .claude-plugin/plugin.json"; exit 1; }
          grep -q "^## $claude_version\$" CHANGELOG.md \
            || { echo "::error file=CHANGELOG.md::no section for version $claude_version"; exit 1; }
          if [ "${GITHUB_REF_TYPE:-}" = tag ]; then
            [ "$GITHUB_REF_NAME" = "v$claude_version" ] \
              || { echo "::error::tag $GITHUB_REF_NAME does not match version $claude_version (expected v$claude_version)"; exit 1; }
          fi

      - name: OpenAI package meets the listing limits
        shell: python3 {0}
        run: |
          # plugin.json and mcp.json are the Agent Plugins package the OpenAI portal reads. Limits from
          # developers.openai.com/plugins/deploy/submission, submission-errors and the Plugin Creator skill.
          import json, re, struct, sys
          from pathlib import Path

          m = json.loads(Path("plugin.json").read_text())
          claude = json.loads(Path(".claude-plugin/plugin.json").read_text())
          tools = {t["name"] for t in json.loads(Path("evals/tools-list.json").read_text())["tools"]}
          errors = []

          def check(ok, message):
              if not ok:
                  errors.append(message)

          def line(value, limit):
              return isinstance(value, str) and 0 < len(value.strip()) and len(value) <= limit and "\n" not in value

          def https(value):
              return isinstance(value, str) and value.startswith("https://") and len(value) <= 1024

          def luminance(color):
              channels = [int(color[i:i + 2], 16) / 255 for i in (1, 3, 5)]
              r, g, b = [c / 12.92 if c <= 0.03928 else ((c + 0.055) / 1.055) ** 2.4 for c in channels]
              return 0.2126 * r + 0.7152 * g + 0.0722 * b

          def contrast(a, b):
              high, low = sorted([luminance(a), luminance(b)], reverse=True)
              return (high + 0.05) / (low + 0.05)

          check(m.get("$schema") == "https://agent-plugins.org/schemas/1.0.0/plugin.schema.json", "$schema must be Agent Plugins 1.0.0")
          check(set(m) <= {"$schema", "name", "version", "description", "author", "homepage", "repository",
                           "license", "keywords", "extensions"}, "plugin.json: only Agent Plugins top-level keys")
          for key in ("name", "version", "description", "keywords", "author"):
              check(m.get(key) == claude.get(key), f"{key} must equal .claude-plugin/plugin.json")
          check(len(m["description"]) <= 1024, "description: at most 1024 characters")
          check(json.loads(Path("mcp.json").read_text()) == {
              "$schema": "https://agent-plugins.org/schemas/1.0.0/mcp.schema.json",
              "mcpServers": {"econdash": {"type": "streamable-http", "url": "https://mcp.econdash.org/mcp"}}},
              "mcp.json must declare exactly one server: econdash, streamable-http, https://mcp.econdash.org/mcp")
          check(not Path(".app.json").exists(), "no .app.json in a public package")

          openai = m.get("extensions", {}).get("com.openai", {})
          check(set(openai) <= {"interface", "review", "publication"}, "extensions.com.openai: interface, review, publication only (no apps)")
          i = openai.get("interface", {})
          check(i.get("displayName") == "EconDash", "interface.displayName must be EconDash")
          check(line(i.get("shortDescription"), 30), "interface.shortDescription: one line, at most 30 characters")
          check(isinstance(i.get("longDescription"), str) and 0 < len(i["longDescription"]) <= 4000,
                "interface.longDescription: at most 4000 characters")
          # The directory shows the verified developer identity; the package must not name another publisher.
          check("developerName" not in i, "interface.developerName: leave it to the verified identity")
          check(i.get("category") in {"Business & Operations", "Communication", "Creativity", "Data & Analytics",
                                      "Developer Tools", "Education & Research", "Entertainment", "Finance",
                                      "Healthcare", "Other", "Productivity", "Scientific Research", "Security", "Travel"},
                "interface.category: not a portal category")
          caps = i.get("capabilities", [])
          check(isinstance(caps, list) and len(caps) <= 20 and all(line(c, 120) for c in caps),
                "interface.capabilities: at most 20, each one line of at most 120")
          for key in ("websiteURL", "supportURL", "privacyPolicyURL", "termsOfServiceURL"):
              check(https(i.get(key)), f"interface.{key}: HTTPS, at most 1024 characters")
          prompts = i.get("defaultPrompt", [])
          check(len(prompts) <= 3 and all(line(p, 128) and "@" not in p for p in prompts)
                and len({" ".join(p.split()).lower() for p in prompts}) == len(prompts),
                "interface.defaultPrompt: at most 3 unique one-line prompts of at most 128 characters, no @mentions")
          for key, background in (("brandColor", "#FFFFFF"), ("brandColorDark", "#212121")):
              color = i.get(key, "")
              check(bool(re.fullmatch(r"#[0-9A-Fa-f]{6}", color)) and contrast(color, background) >= 2,
                    f"interface.{key}: #RRGGBB with at least 2:1 contrast against {background}")
          check("screenshots" not in i, "interface.screenshots: only for plugins with their own UI")
          for key, smallest in (("logo", 256), ("composerIcon", 48)):
              path = i.get(key, "")
              file = Path(path)
              if not (path.startswith("./") and path.endswith(".png") and file.is_file()):
                  errors.append(f"interface.{key}: ./ path to a PNG in the repository")
                  continue
              head = file.read_bytes()[:24]
              width, height = struct.unpack(">II", head[16:24])
              check(head[:8] == b"\x89PNG\r\n\x1a\n" and width == height and smallest <= width <= 4096
                    and file.stat().st_size <= 5 * 1024 * 1024,
                    f"interface.{key}: square PNG, {smallest} to 4096 px, at most 5 MiB")

          review = openai.get("review", {})
          check(review.get("commerce") is False, "review.commerce must be false: no digital sales")
          asked = review.get("prompts", [])
          check(len(asked) <= 20 and all(isinstance(p, str) and p.strip() and len(p) <= 4000 for p in asked),
                "review.prompts: at most 20 nonblank prompts of at most 4000 characters")
          cases = review.get("test_cases", {})
          positive, negative = cases.get("positive", []), cases.get("negative", [])
          check(len(positive) == 5 and len(negative) == 3, "review.test_cases: exactly 5 positive and 3 negative")
          for case in positive:
              named = case.get("tools_triggered")
              check(all(isinstance(case.get(k), str) and case[k].strip()
                        for k in ("description", "prompt", "tools_triggered", "expected_behavior"))
                    and len(case["description"]) <= 4000
                    and {t.strip() for t in named.split(",")} <= tools,
                    f"positive case {case.get('prompt')!r}: string description, prompt, expected_behavior and tools_triggered naming tools from evals/tools-list.json")
          for case in negative:
              check(all(isinstance(case.get(k), str) and case[k].strip() for k in ("description", "prompt")),
                    "negative case: description and prompt")
          publication = openai.get("publication", {})
          check(isinstance(publication.get("release_notes"), str) and publication["release_notes"].strip(), "publication.release_notes is required")
          check(isinstance(publication.get("countries", []), list), "publication.countries: a list of country codes")

          for error in errors:
              print(f"::error file=plugin.json::{error}")
          sys.exit(1 if errors else 0)

      - name: Server tools match evals/tools-list.json
        run: |
          set -euo pipefail
          mcp() {
            curl -sS --fail --max-time 30 https://mcp.econdash.org/mcp -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' -H 'MCP-Protocol-Version: 2025-06-18' -d "$1" \
              | sed -e '/^event:/d' -e 's/^data: //'
          }
          init=$(mcp '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"econdash-plugin-ci","version":"1"}}}')
          tools=$(mcp '{"jsonrpc":"2.0","id":2,"method":"tools/list"}')
          jq -nS --argjson init "$init" --argjson tools "$tools" \
            '{instructions: $init.result.instructions, tools: ($tools.result.tools | sort_by(.name))}' > /tmp/tools-list.json
          diff -u evals/tools-list.json /tmp/tools-list.json \
            || { echo "::error file=evals/tools-list.json::the server's tools changed; commit the new snapshot and see RELEASING.md"; exit 1; }

      - name: Nothing executable, no symlinks, submodules or LFS
        run: |
          set -euo pipefail
          bad=$(git ls-files -s | awk '$1 != "100644" {print $4}')
          [ -z "$bad" ] || { echo "::error::only regular non-executable files are allowed:"; echo "$bad"; exit 1; }
          bad=$(git ls-files | grep -v '^\.github/' | grep -E '(^|/)(hooks|scripts|bin|commands|agents)/|\.(sh|bash|zsh|ps1|bat|cmd|py|js|mjs|cjs|ts|rb|pl|exe|dll|so|dylib|mcpb|dxt|zip|jar)$' || true)
          [ -z "$bad" ] || { echo "::error::executable content is not allowed in the plugin:"; echo "$bad"; exit 1; }
          bad=$(git ls-files | grep -E '(^|/)(\.DS_Store|Thumbs\.db|desktop\.ini|__MACOSX)(/|$)|(^|/)\.(npmrc|yarnrc|yarnrc\.yml)$|(^|/)(bunfig|uv)\.toml$' || true)
          [ -z "$bad" ] || { echo "::error::junk or package-manager config files:"; echo "$bad"; exit 1; }
          if git ls-files '*.gitattributes' | xargs -r grep -nE 'export-ignore|export-subst|filter='; then
            echo "::error::.gitattributes must not use export-ignore, export-subst or filter"; exit 1
          fi

      - name: No images in skills
        run: |
          bad=$(git ls-files 'skills/*' | grep -iE '\.(png|jpe?g|gif|webp|svg|bmp|ico|tiff?|avif|heic)$' || true)
          [ -z "$bad" ] || { echo "::error::images are not allowed in skills/ (keep listing screenshots elsewhere):"; echo "$bad"; exit 1; }

      - name: No hidden Unicode
        shell: python3 {0}
        run: |
          import subprocess, sys
          ranges = [
              (0xE0000, 0xE007F, "tag character"),
              (0x200B, 0x200F, "zero-width or direction mark"),
              (0x202A, 0x202E, "bidi embedding or override"),
              (0x2060, 0x2064, "invisible operator"),
              (0x2066, 0x2069, "bidi isolate"),
              (0x061C, 0x061C, "arabic letter mark"),
              (0x00AD, 0x00AD, "soft hyphen"),
              (0xFEFF, 0xFEFF, "zero-width no-break space"),
          ]
          failed = False
          for path in subprocess.run(["git", "ls-files"], capture_output=True, text=True, check=True).stdout.splitlines():
              data = open(path, "rb").read()
              if b"\0" in data:
                  continue  # binary file
              for lineno, line in enumerate(data.decode("utf-8").splitlines(), 1):
                  for col, ch in enumerate(line, 1):
                      for lo, hi, kind in ranges:
                          if lo <= ord(ch) <= hi:
                              print(f"::error file={path},line={lineno},col={col}::hidden Unicode U+{ord(ch):04X} ({kind})")
                              failed = True
          sys.exit(1 if failed else 0)

      - name: README and context files install nothing else
        run: |
          if git ls-files '*.md' | xargs -r grep -nEi '(curl|wget)[^|]*\|[[:space:]]*(sudo[[:space:]]+)?(ba|z)?sh|\b(npm|pnpm|yarn|bun)[[:space:]]+(i|install|add)\b|\bnpx[[:space:]]|\b(pip|pip3|pipx|uv)[[:space:]]+(install|add|run)\b|\buvx[[:space:]]|\bbrew[[:space:]]+install\b'; then
            echo "::error::documentation must only use the platforms' own plugin install commands"; exit 1
          fi

      - name: README is long enough
        shell: python3 {0}
        run: |
          import re, sys
          text = open("README.md", encoding="utf-8").read()
          text = re.sub(r"^```.*?^```", " ", text, flags=re.S | re.M)
          text = re.sub(r"`[^`]*`", " ", text)
          words = len(re.findall(r"[A-Za-z0-9][A-Za-z0-9'.-]*", text))
          print(f"README words outside code: {words}")
          sys.exit(0 if words >= 40 else 1)

      - name: Golden prompt set is well formed
        run: |
          pip install --quiet --disable-pip-version-check PyYAML==6.0.3
          python3 - <<'EOF'
          import collections, sys, yaml
          prompts = yaml.safe_load(open("evals/golden-prompts.yaml"))["prompts"]
          tools = {"search_indicators", "get_indicator_series", "get_full_series", "compare_countries",
                   "get_indicator_details", "list_countries"}
          categories = {"macroeconomics", "financial markets", "labor", "demographics", "real estate",
                        "commodities and energy", "transport and logistics", "healthcare", "education",
                        "technology and internet"}
          errors = []
          ids = [p["id"] for p in prompts]
          errors += [f"duplicate id {i}" for i, n in collections.Counter(ids).items() if n > 1]
          for p in prompts:
              checks = p.get("checks", [])
              if p["kind"] not in ("direct", "indirect", "negative", "edge") or p["lang"] not in ("en", "ru"):
                  errors.append(f"{p['id']}: unknown kind or lang")
              if p["kind"] == "negative" and (p["call"] is not False or checks):
                  errors.append(f"{p['id']}: a negative prompt expects no call and has no checks")
              if p["call"] is True and not checks:
                  errors.append(f"{p['id']}: call true needs checks")
              if not p.get("answer"):
                  errors.append(f"{p['id']}: no expected answer")
              errors += [f"{p['id']}: unknown tool {c['tool']}" for c in checks if c["tool"] not in tools]
              errors += [f"{p['id']}: check without expect" for c in checks if not c.get("expect")]
          en = collections.Counter(p["kind"] for p in prompts if p["lang"] == "en")
          for kind, low, high in (("direct", 10, 15), ("indirect", 20, 30), ("negative", 10, 15), ("edge", 5, 10)):
              if not low <= en[kind] <= high:
                  errors.append(f"{en[kind]} English {kind} prompts, expected {low}-{high}")
          if not 40 <= sum(en.values()) <= 60:
              errors.append(f"{sum(en.values())} English prompts, expected 40-60")
          if sum(p["lang"] == "ru" for p in prompts) < 10:
              errors.append("fewer than 10 Russian prompts")
          missing = categories - {p["category"] for p in prompts if p["kind"] in ("direct", "indirect")}
          if missing:
              errors.append(f"no direct or indirect prompt for: {', '.join(sorted(missing))}")
          print("\n".join(f"::error file=evals/golden-prompts.yaml::{e}" for e in errors) or f"{len(prompts)} prompts OK")
          sys.exit(1 if errors else 0)
          EOF

      - name: Skills and GEMINI.md stay neutral
        run: |
          [ -d skills ] || { echo "no skills yet"; exit 0; }
          # Gemini CLI loads GEMINI.md into every session, so it follows the skills' wording rules and stays short
          [ "$(wc -l < GEMINI.md)" -le 60 ] || { echo "::error file=GEMINI.md::longer than 60 lines"; exit 1; }
          if grep -rnEi '\bclaude\b|\banthropic\b|\bchatgpt\b|\bopenai\b|\bgemini\b|\bgrok\b|always use|you must use|ignore (all|previous|prior)|do not (tell|mention)|checkout|pricing|upgrade|subscri|x402|payment|wallet' skills GEMINI.md; then
            echo "::error::skills must be provider-neutral, must not steer the model to always use EconDash, and must not mention payments"; exit 1
          fi
          # Words that rank or oversell, and phrases that skill scanners treat as signs of an attack
          if grep -rnEi '\bnever\b|\bprefer|\bbest\b|\bofficial|\bcertified\b|\bprices?\b|silently|without asking|already approved|before answering' skills GEMINI.md; then
            echo "::error::skills must describe situations, not rank tools, sell, or hide steps from the user"; exit 1
          fi
          bad=$(grep -rhoE 'https?://[^ )>`"]+' skills GEMINI.md | grep -vE '^https://([a-z0-9-]+\.)*(econdash\.org|worldbank\.org|imf\.org|stlouisfed\.org|europa\.eu|oecd\.org|who\.int|ilo\.org)(/|$)' || true)
          [ -z "$bad" ] || { echo "::error::links in skills must point at econdash.org or a data source:"; echo "$bad"; exit 1; }

      - name: Skills are well formed
        shell: python3 {0}
        run: |
          import pathlib, re, sys
          errors = []
          for skill in sorted(pathlib.Path("skills").glob("*/SKILL.md")):
              text = skill.read_text(encoding="utf-8")
              front = re.match(r"---\n(.*?)\n---\n", text, re.S)
              fields = dict(re.findall(r"^(\w+): (.+)$", front.group(1), re.M)) if front else {}
              # Agent Skills spec: name 1-64 lowercase letters, digits and single hyphens; description 1-1024 chars
              if not re.fullmatch(r"[a-z0-9]+(-[a-z0-9]+)*", fields.get("name", "")) or len(fields["name"]) > 64:
                  errors.append(f"{skill}: name must be 1-64 lowercase letters, digits and single hyphens")
              if fields.get("name") != skill.parent.name:
                  errors.append(f"{skill}: frontmatter name must equal the folder name")
              if not fields.get("description", "").startswith("Use when") or len(fields["description"]) > 1024:
                  errors.append(f"{skill}: description must say when to use the skill, in at most 1024 characters")
              if len(text.splitlines()) > 80:
                  errors.append(f"{skill}: longer than 80 lines, move details to references/")
          print("\n".join(f"::error::{e}" for e in errors) or "skills OK")
          sys.exit(1 if errors else 0)

      - name: Skill prompt set covers every category
        run: |
          pip install --quiet --disable-pip-version-check PyYAML==6.0.3
          python3 - <<'EOF'
          import collections, pathlib, sys, yaml
          prompts = yaml.safe_load(open("evals/skill-prompts.yaml"))["prompts"]
          skills = {p.name for p in pathlib.Path("skills").iterdir() if (p / "SKILL.md").exists()}
          tools = {"search_indicators", "get_indicator_series", "get_full_series", "compare_countries",
                   "get_indicator_details", "list_countries"}
          categories = {"macroeconomics", "financial markets", "labor", "demographics", "real estate",
                        "commodities and energy", "transport and logistics", "healthcare", "education",
                        "technology and internet"}
          errors = []
          for p in prompts:
              if p["skill"] is None:
                  if p["call"] is not False or p.get("checks"):
                      errors.append(f"near miss expects a call: {p['prompt']}")
                  continue
              if p["skill"] not in skills:
                  errors.append(f"unknown skill {p['skill']}: {p['prompt']}")
              if p["call"] is not True or not p.get("checks"):
                  errors.append(f"skill prompt needs call: true and checks: {p['prompt']}")
              errors += [f"unknown tool {c['tool']}: {p['prompt']}" for c in p.get("checks", []) if c["tool"] not in tools]
          count = collections.Counter((p["skill"], p["category"]) for p in prompts if p["skill"])
          for skill in ("compare-economies", "cite-economic-data"):
              errors += [f"{skill}: fewer than 2 prompts for {c}" for c in sorted(categories) if count[(skill, c)] < 2]
          errors += [f"{s}: no prompts" for s in skills if not any(k[0] == s for k in count)]
          if sum(p["skill"] is None for p in prompts) < 10:
              errors.append("fewer than 10 near misses")
          print("\n".join(f"::error file=evals/skill-prompts.yaml::{e}" for e in errors) or f"{len(prompts)} skill prompts OK")
          sys.exit(1 if errors else 0)
          EOF

      - name: Indicator slugs in skills exist
        shell: python3 {0}
        run: |
          import json, pathlib, re, sys, urllib.request
          slugs = sorted({s for p in pathlib.Path("skills").rglob("*.md")
                          for s in re.findall(r"`([a-z0-9]+(?:-[a-z0-9]+)+)`", p.read_text(encoding="utf-8"))})
          missing = []
          for slug in slugs:
              body = json.dumps({"jsonrpc": "2.0", "id": 1, "method": "tools/call",
                                 "params": {"name": "get_indicator_details", "arguments": {"indicator": slug}}}).encode()
              req = urllib.request.Request("https://mcp.econdash.org/mcp", body, {
                  "Content-Type": "application/json", "Accept": "application/json, text/event-stream",
                  "MCP-Protocol-Version": "2025-06-18"})
              raw = urllib.request.urlopen(req, timeout=30).read().decode()
              raw = "\n".join(line[6:] for line in raw.splitlines() if line.startswith("data: ")) or raw
              result = json.loads(raw)["result"]
              if result.get("isError"):
                  text = result["content"][0]["text"]
                  if "No indicator" not in text:  # rate limit or server error: the slug was not checked
                      sys.exit(f"::error::could not check {slug}: {text}")
                  missing.append(slug)
          print(f"{len(slugs)} slugs checked")
          print("\n".join(f"::error::no indicator {s} in the EconDash catalogue" for s in missing))
          sys.exit(1 if missing else 0)

      - name: Actions pinned by commit SHA
        run: |
          if grep -rnE '^\s*-?\s*uses:' .github/workflows | grep -vE 'uses:\s*[^@[:space:]]+@[0-9a-f]{40}(\s|$)'; then
            echo "::error::pin every action to a full commit SHA"; exit 1
          fi

      - name: No secrets (gitleaks)
        run: |
          set -euo pipefail
          version=8.30.1
          sha256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          echo "${sha256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --verbose .
