# Golden prompt set for the EconDash plugin.
#
# Real questions, mostly from Google Search Console queries for econdash.org, that check
# whether a model calls EconDash when it should (recall) and leaves it alone when it
# should not (precision). The same set is used on every platform, so results compare.
#
# Fields
#   kind       direct   - the user names EconDash
#              indirect - the user asks for data without naming a tool
#              negative - EconDash must not be called
#              edge     - missing country, year, indicator or history; the answer must not invent numbers
#   call       true: an EconDash tool is expected; false: none; optional: either is fine
#   checks     the data calls a correct answer rests on (search_indicators may come first).
#              tool and args are what a good model sends; expect is checked against the live
#              server, values recorded on 2026-10-22 with a relative tolerance for revisions.
#   also_ok    other indicator slugs that answer the question as well
#   any_country  the series is a world price or rate stored under one code (GLB, USA, EUR);
#              any code that returns the data counts
#   answer     what a correct answer says
#   signed_in  how the answer differs for a user signed in to EconDash (full history);
#              everything else is the same for anonymous and signed-in users
#   known_gap  a server problem the model has to work around today
#
# Grading a model run, per prompt: called = any EconDash tool was called.
#   recall    = prompts with call: true where it called / all prompts with call: true
#   precision = prompts where it called that have call: true or optional / all prompts where it called
#   accuracy  = of the expected calls, those where a data tool, indicator (checks or also_ok)
#               and country match; for edge prompts the answer must state the gap instead of a number.
#
# The expected values are re-checked against the live server and the chart pages on
# econdash.org before each release.

prompts:
- id: direct-germany-gdp-growth-10y
  kind: direct
  lang: en
  category: macroeconomics
  source: manual
  prompt: Use EconDash to get Germany's GDP growth for the last ten years.
  call: true
  also_ok:
  - real-gdp-growth
  checks:
  - tool: get_indicator_series
    args:
      indicator: gdp-growth-annual-percent
      country: DEU
      start_year: 2016
    expect:
      approx:
        values.2016:
        - 2.22222216259371
        - 0.05
        values.2021:
        - 3.90999994204108
        - 0.05
        values.2025:
        - 0.239578342117881
        - 0.05
  answer: Annual real GDP growth for Germany 2016-2025 with the 2020 contraction, source World Bank and the chart
    link.
