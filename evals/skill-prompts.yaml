# Questions the skills in skills/ are written for, in all ten EconDash categories.
#
# Each category has five compare-economies and five cite-economic-data prompts; macro-research
# has four country overviews. Prompts with skill: null are near misses: questions on the same
# topics that need no EconDash data, where no skill should load and no tool should be called.
#
# Fields as in golden-prompts.yaml: call, checks (the data call a correct answer rests on),
# also_ok (other slugs that answer it), any_country (a series stored under one code).
# The expected series were checked against the live server on 2026-10-24.
#
# A run passes when the model loads the named skill on its prompts, loads none on the near
# misses, and the data calls match the checks.

prompts:
- skill: macro-research
  category: macroeconomics
  prompt: Give me a macro snapshot of Brazil.
  call: true
  checks:
  - tool: get_indicator_series
    args:
      indicator: gdp-growth-annual-percent
      country: BRA
  also_ok:
  - gdp-growth-annual-percent
  - real-gdp-growth
  - gdp-per-capita
  - gdp-per-capita-imf
  - cpi-inflation-rate-percent
  - cpi-inflation
  - unemployment-ilo-estimates
  - unemployment-rate
  - government-debt-percent-gdp
  - gross-government-debt
  - current-account-balance-2
  - current-account-balance
  - trade-volume-percent-gdp
